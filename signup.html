<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Register</title>
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.2/css/all.css" integrity="sha384-/rXc/GQVaYpyDdyxK+ecHPVYJSN9bmVFBvjA/9eOB+pb3F2w2N6fc5qB9Ew5yIns" crossorigin="anonymous">
</head>
<body>
    
    <div class="mobile-wrapper">

        <div class="register-title">Create your <br>account!</div>

        <div class="register-form-wrapper">
            <form class="register-form" action="#">

                <div class="input-wrapper">
                    <div class="profile-wrapper">
                        <i class="fas fa-user profile-icon"></i>
                    </div>
                    <div class="input-group profile-input-group">
                        <input type="text" name="firstname" placeholder="First name">
                        <input type="text" name="firstname" placeholder="Last name">
                    </div>
                </div>

                <div class="input-wrapper">
                    <div class="input-group info-input-group">
                        <label for="email"><i class="far fa-envelope"></i></label>
                        <input type="email" name="email" id="email" placeholder="E-mail">
                    </div>
                    <div class="input-group info-input-group">
                        <label for="password"><i class="fas fa-unlock"></i></label>
                        <input type="password" name="password" id="password" placeholder="Password">
                    </div>
                    <div class="input-group info-input-group">
                        <label for="confirmpassword"><i class="fas fa-unlock"></i></label>
                        <input type="password" name="confirmpassword" id="password" placeholder="Confirm Password">
                    </div>
                    <div class="input-group info-input-group">
                        <label for="phone"><i class="fas fa-mobile-alt"></i></label>
                        <input type="text" name="phone" id="phone" placeholder="Phone Number">
                    </div>
                </div>

                <button class="register-btn"><a href="login.html" style="color: white;">GET STARTED</a></button>

            </form>
        </div>

        <p class="help-text">Already have an account?<span><a href="login.html" id="login">Login</a></span></p>

    </div>
    
</body>
</html>
